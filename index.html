<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Benny's Town – Find your house</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#060919;font-family:Poppins,system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;touch-action:none;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:12px 12px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:3}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:17px;letter-spacing:.3px;background:linear-gradient(90deg,#ff2e63,#ff8a3d);padding:7px 14px;border-radius:14px;box-shadow:0 4px 18px rgba(255,46,99,.35);white-space:nowrap}
.stats{display:flex;gap:5px;flex:none}
.chip{background:rgba(10,12,26,.86);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 7px;text-align:center;min-width:48px}
.chip b{display:block;font-size:14px;line-height:1.1}
.chip span{font-size:9.5px;color:#9aa3c7;letter-spacing:.4px}
#sBank{color:#46e08a}
.search{display:flex;gap:8px;pointer-events:auto;max-width:560px;width:100%;margin:0 auto}
.search input{flex:1;min-width:0;font:600 16px Poppins,system-ui,sans-serif;color:#fff;background:rgba(10,12,26,.9);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 14px;outline:none}
.search input:focus{border-color:#ffd23f}
.search button{font:800 15px Poppins,system-ui,sans-serif;color:#1b1728;background:#ffd23f;border:0;border-radius:14px;padding:0 16px;cursor:pointer}
.sugg{display:none;flex-direction:column;pointer-events:auto;max-width:560px;width:100%;margin:-4px auto 0;background:rgba(12,14,30,.97);border:1px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden}
.sugg.on{display:flex}
.sugg button{font:600 15px Poppins,system-ui,sans-serif;color:#fff;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg button:last-child{border-bottom:0}
.sugg button span{color:#9aa3c7;font-size:12px;white-space:nowrap}
.sugg button b{color:#ffd23f;font-weight:700}
.hint{font-size:12px;color:#c3c9e4;text-align:center;text-shadow:0 1px 4px #000}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 12px 14px;display:flex;flex-direction:column;gap:10px;z-index:3;pointer-events:none}
#recent{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:2px}
#recent::-webkit-scrollbar{display:none}
#recent .lbl{flex:none;align-self:center;font-size:12px;color:#ffd23f;font-weight:700;padding-right:2px}
#recent button{flex:none;font:600 13px Poppins,system-ui,sans-serif;color:#fff;background:rgba(10,12,26,.86);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 11px;cursor:pointer}
#recent .empty{font-size:13px;color:#c3c9e4;background:rgba(10,12,26,.8);border-radius:12px;padding:8px 12px}
.cta{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(10,12,26,.9);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 12px}
.cta p{margin:0;font-size:13px;line-height:1.3}
.cta p b{color:#ffd23f}
.cta .btns{display:flex;gap:6px;flex:none}
.cta a,.cta button{font:700 13px Poppins,system-ui,sans-serif;border:0;border-radius:12px;padding:8px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
#follow{display:none;align-items:center;color:#fff;background:#ff2e63}
#all{color:#fff;background:#262b4a}
#card{position:fixed;left:50%;bottom:150px;transform:translate(-50%,30px);opacity:0;pointer-events:none;width:min(92vw,420px);background:rgba(12,14,30,.96);border:2px solid #ffd23f;border-radius:20px;padding:14px 16px;z-index:4;transition:.25s}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card.miss{border-color:#ff6b8b}
#cardTitle{font-size:22px;font-weight:800;word-break:break-all;padding-right:30px}
#cardMeta{font-size:13px;color:#9aa3c7;margin-top:2px}
#cardOg{display:none;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:800;color:#1b1728;background:#ffd23f;border-radius:10px;padding:3px 9px}
#cardMsg{font-size:14px;margin-top:8px;line-height:1.35}
#cardStats{display:none;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
#cardStats.on{display:grid}
#cardStats div{background:rgba(255,255,255,.06);border-radius:10px;padding:5px 3px;text-align:center}
#cardStats b{display:block;font-size:15px;line-height:1.1}
#cardStats span{font-size:10px;color:#9aa3c7;letter-spacing:.3px}
#cardUp{display:none;margin-top:10px;font-size:12px;color:#c3c9e4}
#cardUp.on{display:block}
#cardUp .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
#cardUp .bar i{display:block;height:100%;background:linear-gradient(90deg,#46e08a,#ffd23f);border-radius:5px}
#v3d{position:fixed;inset:0;z-index:10;display:none;background:#1b2049}
#v3d.on{display:block}
#c3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.v3top{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 2px 8px #000}
#v3name{font-size:22px;font-weight:800;word-break:break-all;padding-right:44px}
#v3sub{font-size:13px;color:#ffd23f}
#v3close{position:absolute;right:12px;top:10px;width:38px;height:38px;border-radius:19px;border:0;background:rgba(10,12,26,.85);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.v3bot{position:absolute;left:12px;right:12px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#v3tier{font-size:13px;font-weight:700;background:rgba(10,12,26,.88);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:7px 12px}
.v3hint{font-size:11px;color:#c3c9e4}
#v3load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;color:#c3c9e4}
#view3d{display:none;margin-top:8px;width:100%;font:800 14px Poppins,system-ui,sans-serif;color:#1b1728;background:#ffd23f;border:0;border-radius:12px;padding:10px;cursor:pointer}
#view3d.on{display:block}
#bennyBtn{position:fixed;right:12px;top:150px;z-index:3;font:700 13px Poppins,system-ui,sans-serif;color:#fff;background:rgba(10,12,26,.88);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:6px 11px 6px 8px;cursor:pointer;display:flex;align-items:center;gap:5px}
#bennyBtn i{font-style:normal;font-size:16px}
#close{position:absolute;right:10px;top:8px;font-size:22px;color:#9aa3c7;background:none;border:0;cursor:pointer}
#demo{display:none;position:fixed;right:10px;top:132px;z-index:3;font-size:11px;font-weight:700;color:#1b1728;background:#ffd23f;border-radius:8px;padding:3px 8px}
@media (max-width:380px){.logo{font-size:16px;padding:6px 10px}.chip{min-width:50px;padding:4px 6px}.chip b{font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="brand">
    <div class="logo">BENNY'S TOWN</div>
    <div class="stats">
      <div class="chip"><b id="sBank">€0.00</b><span>BANK</span></div>
      <div class="chip"><b id="sTen">0</b><span>TENANTS</span></div>
      <div class="chip"><b id="sDay">1</b><span>DAY</span></div>
    </div>
  </div>
  <div class="search"><input id="q" placeholder="Find your house: @username" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="find">Find</button></div>
  <div class="sugg" id="sugg"></div>
  <div class="hint" id="hint">Drag to look around · pinch or scroll to zoom · tap a house</div>
</div>
<div id="card"><button id="close" aria-label="Close">×</button><div id="cardTitle"></div><div id="cardMeta"></div><div id="cardOg">👑 OG TENANT</div><div id="cardStats"></div><div id="cardUp"></div><button id="view3d">🔍 View house in 3D</button><div id="cardMsg"></div></div>
<button id="bennyBtn" aria-label="Go to Benny"><i>🧢</i>Benny</button>
<div id="v3d"><canvas id="c3d"></canvas><div class="v3top"><span id="v3name"></span><span id="v3sub"></span></div><button id="v3close" aria-label="Close 3D view">×</button><div id="v3load">Building your house…</div><div class="v3bot"><div id="v3tier"></div><div class="v3hint">Drag to turn · pinch or scroll to zoom</div></div></div>
<div class="bottom">
  <div id="recent"></div>
  <div class="cta"><p>Every TikTok follower gets a <b>free house</b> in Benny's Town 🏠</p><div class="btns"><a id="follow" target="_blank" rel="noopener">Follow</a><button id="all">Whole town</button></div></div>
</div>
<script>
(() => {
'use strict';
const CONFIG = { currency: '€' };
const S = { T: 0 };
/* ------------------------------------------------------------------ basics */
let W = 1080, H = 1920;
const LIVE = /live/i.test(location.hash + location.search);
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TW = 128, TH = 64;            // iso tile size
let FX = 560, FY = 1290;          // screen point the camera looks at
const OUT = '#1b1728';
const CEN = 3;                      // city centre in tile coords (middle of Benny's square)
const CONF = ['#ff4d6d', '#ffd23f', '#3ddc84', '#4da3ff', '#b07cff', '#ff8a3d'];
const OPT_COL = ['#ff4d6d', '#3ddc84', '#4da3ff'];

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const eOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eBack = t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
function bounce(t) { t = clamp(t, 0, 1); const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
function hashStr(s) { let h = 2166136261 >>> 0; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
const h2 = (i, j) => hashStr(i + ':' + j);
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = c => (c < 0 ? '-' : '') + CONFIG.currency + (Math.abs(c) / 100).toFixed(2);
const fmtN = n => Math.round(n).toLocaleString('en-US');
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const F = sz => `700 ${sz}px Poppins, "Segoe UI", system-ui, sans-serif`;
const EF = sz => `${sz}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
function dayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function seeded(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }

const _shade = {};
function shade(hex, k) {
  const key = hex + k; if (_shade[key]) return _shade[key];
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * k), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * k), 0, 255), b = clamp(Math.round((n & 255) * k), 0, 255);
  return (_shade[key] = `rgb(${r},${g},${b})`);
}

/* ---------------------------------------------------------- draw helpers */
function poly(c, pts, fill, stroke, lw) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); } }
function rrect(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function panel(x, y, w, h, r, fill, stroke, lw) { rrect(ctx, x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function txt(s, x, y, sz, col, al, bl) { ctx.font = F(sz); ctx.fillStyle = col; ctx.textAlign = al || 'left'; ctx.textBaseline = bl || 'alphabetic'; ctx.fillText(s, x, y); }
function otxt(s, x, y, sz, col, sw, scol, al, bl) { ctx.font = F(sz); ctx.textAlign = al || 'center'; ctx.textBaseline = bl || 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = scol || '#0d0b18'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y); }
function fitSize(s, sz, maxW) { ctx.font = F(sz); const w = ctx.measureText(s).width; return w > maxW ? Math.floor(sz * maxW / w) : sz; }
function emoji(c, e, x, y, sz) { c.font = EF(sz); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(e, x, y); }
function ellipse(c, x, y, rx, ry, fill, stroke, lw) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
function circle(c, x, y, r, fill, stroke, lw) { c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
function line(c, x1, y1, x2, y2, col, lw) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
function wrapText(s, x, y, sz, maxW, col) {
  ctx.font = F(sz); const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur); const ls = lines.slice(0, 2); const lh = sz * 1.15, y0 = y - (ls.length - 1) * lh / 2;
  ls.forEach((l, k) => txt(l, x, y0 + k * lh, fitSize(l, sz, maxW), col, 'center', 'middle'));
}

/* ------------------------------------------------------------- city grid */
const mod3 = n => ((n % 3) + 3) % 3;
const mod2 = n => ((n % 2) + 2) % 2, mod6 = n => ((n % 6) + 6) % 6;
// layout: every house stands alone on its own plot. Streets run along i (every 2nd row) and cross streets every 6th row;
// the rows in between are garden strips, so no house is ever hidden behind its neighbour.
const isRoad = (i, j) => mod2(i) === 0 || mod2(j) === 0;
// special blocks (6x6 tiles, always framed by streets): Benny's square in the middle, new places a few streets further out
const blockOf = n => Math.floor(n / 6);
const RESERVED = { '0,0': 'square', '2,0': 'park', '0,2': 'hall' };
const isPlaza = (i, j) => !!RESERVED[blockOf(i) + ',' + blockOf(j)];
const LOTS = [];
(function () {
  const N = 78;
  for (let i = -N; i <= N + 3; i++) for (let j = -N; j <= N + 3; j++) {
    if (isRoad(i, j) || isPlaza(i, j)) continue;
    const hh = h2(i, j); LOTS.push({ i, j, h: hh, d: Math.hypot(i - CEN, j - CEN) + (hh % 1000) / 1000 * 0.45 });
  }
  LOTS.sort((a, b) => a.d - b.d);
})();
const lotUV = k => LOTS[Math.min(k, LOTS.length - 1)];
const isoW = (u, v) => [(u - v) * TW / 2, (u + v) * TH / 2];
const cam = { x: 0, y: 116, z: 1 };
const toS = (wx, wy) => [(wx - cam.x) * cam.z + FX, (wy - cam.y) * cam.z + FY];
const uvS = (u, v) => toS((u - v) * TW / 2, (u + v) * TH / 2);
const lotW = lot => { const L = lotUV(lot); return isoW(L.i, L.j); };

/* ---------------------------------------------------------------- houses */
const STY = [
  { f: .5, wall: 28, roofH: 22, roof: 'gable' },    // cottage (every house)
  { f: .62, wall: 56, roofH: 24, roof: 'gable' },   // two-storey
  { f: .70, wall: 42, roofH: 0, roof: 'flat' },     // modern
  { f: .50, wall: 112, roofH: 0, roof: 'flat' },    // tower
];
const PAL = [['#f3e3c3', '#d9534f'], ['#cfe3f2', '#3c5a99'], ['#f6c9cf', '#7b4b94'], ['#d7efd2', '#2f7d6b'], ['#f2d6a2', '#8a4b2e'], ['#e4e4ec', '#e07a2e'],
  ['#f7e27a', '#7b4b94'], ['#7fb2ec', '#2b4f8f'], ['#e8737a', '#8e2430'], ['#d9c8f2', '#5b3f8f'], ['#f7c8a8', '#b5523a'], ['#f4f4f4', '#3f7d4f']];
const COLOR_NAMES = { cream: 0, lightblue: 1, pink: 2, mint: 3, sand: 4, grey: 5, yellowpurple: 6, blue: 7, red: 8, lavender: 9, peach: 10, white: 11 };
const styleOf = v => 0;   // every house: same one-storey cottage with a pitched roof (upgrades come later)
const WIN = {
  0: { L: [[.18, 0, .2, .68, 'd'], [.55, .32, .26, .36, 'w']], R: [[.36, .32, .28, .36, 'w']] },
  1: { L: [[.16, 0, .18, .38, 'd'], [.55, .1, .24, .26, 'w'], [.16, .58, .22, .26, 'w'], [.55, .58, .24, .26, 'w']], R: [[.18, .1, .24, .26, 'w'], [.58, .1, .24, .26, 'w'], [.18, .58, .24, .26, 'w'], [.58, .58, .24, .26, 'w']] },
  2: { L: [[.1, 0, .2, .45, 'd'], [.38, .12, .52, .3, 'g'], [.08, .58, .84, .28, 'g']], R: [[.14, .18, .3, .56, 'g'], [.56, .18, .3, .56, 'g']] },
  3: { L: [], R: [] },
};
for (let r = 0; r < 6; r++) {
  const y = .06 + r * .155;
  for (const x of [.16, .58]) {
    if (r === 0 && x === .16) WIN[3].L.push([.14, 0, .24, .1, 'd']); else WIN[3].L.push([x, y, .24, .09, 'w']);
    WIN[3].R.push([x, y, .24, .09, 'w']);
  }
}
function variantFor(seedStr) { return (hashStr(seedStr) >>> 8) % PAL.length; }
function variantForLot(seedStr, lot) { return variantFor(seedStr); }

function faceDraw(c, A, B, hClip, hFull, list, s, seed) {
  const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
  if (len < 1 || hClip < 1) return;
  c.save();
  c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(B[0], B[1]); c.lineTo(B[0], B[1] - hClip); c.lineTo(A[0], A[1] - hClip); c.closePath(); c.clip();
  c.transform(dx / len, dy / len, 0, -1, A[0], A[1]);
  for (let k = 0; k < list.length; k++) {
    const [x0, y0, w, h, kind] = list[k];
    const X = x0 * len, Y = y0 * hFull, Wd = w * len, Hd = h * hFull;
    if (kind === 'd') {
      c.fillStyle = '#6b4a33'; c.fillRect(X, Y, Wd, Hd);
      c.fillStyle = '#e8c25a'; c.fillRect(X + Wd * .7, Y + Hd * .42, Math.max(1, Wd * .14), Math.max(1, Hd * .07));
    } else {
      const lit = ((seed >>> (k % 24)) & 3) !== 0;
      c.fillStyle = kind === 'g' ? (lit ? '#ffe08a' : '#4a5a86') : (lit ? '#ffd56b' : '#3d4566');
      c.fillRect(X, Y, Wd, Hd);
      c.strokeStyle = 'rgba(70,45,30,.6)'; c.lineWidth = Math.max(.6, 1.1 * s); c.strokeRect(X, Y, Wd, Hd);
      if (kind === 'w' && Wd > 5) { c.beginPath(); c.moveTo(X + Wd / 2, Y); c.lineTo(X + Wd / 2, Y + Hd); c.moveTo(X, Y + Hd / 2); c.lineTo(X + Wd, Y + Hd / 2); c.stroke(); }
    }
  }
  c.restore();
}

function drawHouse(c, x, y, s, v, o) {
  o = o || {};
  const st = STY[styleOf(v)], pal = PAL[v % PAL.length], seed = o.seed || 12345;
